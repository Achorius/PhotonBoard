# Refreshes the offline fixture library (resources/fixture-library) from the
# latest Open Fixture Library and QLC+ fixture definitions, and opens a pull
# request when anything changed. The bundle is committed, so app builds
# (dev, build-dmg.sh, .deb for the Pi image) never need the network.
name: Fixture library update

on:
  schedule:
    - cron: "17 4 1 * *" # monthly
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: fixture-library
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Only esbuild / fast-xml-parser / vitest are needed: skip Electron, browsers…
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild the library from the latest sources
        run: npm run fixtures:update

      - name: Test the converters and the new bundle
        run: npx vitest run src/main/fixture-convert.test.ts src/main/fixture-catalog.test.ts src/main/fixture-parsers.test.ts src/main/ofl-service.test.ts

      - name: Open a pull request
        run: |
          set -euo pipefail
          if git diff --quiet -- resources/fixture-library; then
            echo "Fixture library is up to date."
            exit 0
          fi
          summary=$(python3 -c 'import json; m=json.load(open("resources/fixture-library/manifest.json")); print("%d fixtures, %d manufacturers — " % (m["fixtureCount"], m["manufacturerCount"]) + ", ".join("%s %s (%d)" % (s["name"], s["revision"][:12], s["fixtureCount"]) for s in m["sources"]))')
          branch="fixture-library/$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add resources/fixture-library
          git commit -m "Update the offline fixture library" -m "$summary"
          git push --force origin "$branch"
          gh pr create --head "$branch" --title "Update the offline fixture library" \
            --body "Regenerated by \`npm run fixtures:update\` (scripts/build-fixture-library.mjs).

          $summary

          See resources/fixture-library/manifest.json for the source commits and skipped files." \
            || echo "A pull request for $branch already exists."
